services:
  writely:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: writely-frontend
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - WATCHPACK_POLLING=true 
    restart: unless-stopped