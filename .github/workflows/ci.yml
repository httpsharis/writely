name: Writely CI Pipeline

# 1. When should this action run?
on:
  push:
    branches: [ "redesign", "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-validate:
    name: Build, Lint, and Type Check
    runs-on: ubuntu-latest

    steps:
      # 2. Grab your code from GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 3. Install pnpm (Since we saw pnpm-lock.yaml in your earlier errors)
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 8

      # 4. Set up Node.js
      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      # 5. Install Dependencies (Cleanly)
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # 6. Check for messy code / syntax errors
      - name: Run ESLint
        run: pnpm run lint

      # 7. Strictly check TypeScript (No red squiggles allowed)
      - name: Type Check
        run: pnpm tsc --noEmit

      # 8. Attempt a Full Production Build
      - name: Build Next.js App
        run: pnpm run build
        env:
          # Note: Next.js sometimes requires public ENVs at build time
          NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.NEXT_PUBLIC_GOOGLE_CLIENT_ID }}
          NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000" # Dummy fallback for build